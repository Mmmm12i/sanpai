<title>神社参拝帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 静かで丁寧、参拝の記録帳
   IDEA: 御朱印帳 — 朱の表紙、白い和紙の頁、朱印のチェック
   PICTURE: 朱の帯に鳥居と参拝数、その下に一覧そのもの
   COLOUR and TYPE: 朱 #c9381f・白・墨、夜は深い墨色。しっぽり明朝 + 禅角ゴシック
   LAYOUT: 帯 → タブ → 検索 → 都道府県ごとの一覧。詳細は下から出るシート */
:root{color-scheme:light dark;--bg:light-dark(#fbfaf7,#121417);--ink:light-dark(#1c1a18,#ece8e1);--paper:light-dark(#fff,#1b1e23);--line:light-dark(#e7e2d9,#2d3139);--mute:light-dark(#6e675f,#a39d94);--shu:light-dark(#c9381f,#e05a3e);--band:light-dark(#c9381f,#7e2414);--soft:light-dark(#fbeae5,#3a1d17)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
h1,h2,h3{font-family:"Shippori Mincho B1",serif;margin:0;line-height:1.1;text-wrap:balance}
.band{background:var(--band);color:#fff;padding:calc(clamp(22px,4vw,44px) + env(safe-area-inset-top)) max(5vw,16px,env(safe-area-inset-right)) 26px;position:relative;overflow:hidden}
.band .in{max-width:1000px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;position:relative}
.band h1{font-size:clamp(32px,6vw,48px)}
.band p{margin:6px 0 0;opacity:.88}
.torii{position:absolute;right:-30px;top:-10px;width:300px;opacity:.16;pointer-events:none}
.big{font-family:"Shippori Mincho B1",serif;font-size:clamp(40px,9vw,64px);font-weight:800;line-height:1;text-align:right}
.big small{font-size:18px;font-weight:700;margin-left:4px}
.sub{text-align:right;font-size:14px;opacity:.9}
.pw{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.pw b{font-family:"Shippori Mincho B1",serif;font-size:28px;font-weight:800;white-space:nowrap;min-width:3.6em;text-align:right}
.pstat{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;opacity:.92;margin-top:-6px}
.pstat span b{font-size:16px}
.prog{flex:1;height:10px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .5s}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .in{max-width:1000px;margin:auto;display:flex;padding:0 max(5vw,16px) 0;gap:4px}
.tab{flex:1;min-height:48px;border:0;background:none;border-bottom:3px solid transparent;font-weight:700;color:var(--mute)}
.tab[aria-selected=true]{color:var(--shu);border-color:var(--shu)}
main{max-width:1000px;margin:auto;padding:16px max(5vw,16px) 80px}
.tools{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
input[type=search],select,input[type=text],input[type=date],textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px;width:fit-content;max-width:100%}
.seg button{border:0;background:var(--paper);min-height:40px;padding:0 14px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--shu);color:#fff}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
.grp{margin-top:22px}
.grp h2{font-size:20px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px}
.grp h2 span{font:700 14px "Zen Kaku Gothic New",sans-serif;color:var(--mute)}
ul.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.chk{flex:none;width:48px;height:52px;border:0;background:none;display:grid;place-items:center}
.chk b{width:26px;height:26px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:18px;height:18px;opacity:0}
.done .chk b{background:var(--shu);border-color:var(--shu)}
.done .chk svg{opacity:1}
.info{flex:1;border:0;background:none;text-align:left;padding:8px 4px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;min-height:52px}
.nm{font-weight:700}
.ct{font-size:13px;color:var(--mute);grid-column:1}
.meta{grid-row:1/3;grid-column:2;font-size:12px;color:var(--shu);text-align:right;white-space:nowrap}
.mine{font-size:11px;border:1px solid var(--mute);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--mute);font-weight:400}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--shu);background:var(--paper);color:var(--shu);font-weight:700}
.btn.p{background:var(--shu);color:#fff}
.btn.del{border-color:var(--mute);color:var(--mute)}
.map{color:var(--shu);font-weight:700;display:inline-block;padding:10px 0}
.mcat{font-size:22px;margin:28px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.mcat:first-child{margin-top:8px}
.gcard{border:1px solid var(--line);border-radius:14px;background:var(--paper);margin-top:14px;padding:0 14px 6px}
.gcard.comp{border-color:var(--shu)}
.ghead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;width:100%;border:0;background:none;text-align:left;padding:14px 0 10px;align-items:center}
.gt{font:800 19px/1.3 "Shippori Mincho B1",serif}
.gp{font:800 24px "Shippori Mincho B1",serif;color:var(--shu);white-space:nowrap}
.gbar{grid-column:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--shu)}
.gn{font-size:13px;color:var(--mute);white-space:nowrap}
.ok{font:700 12px "Zen Kaku Gothic New",sans-serif;background:var(--shu);color:#fff;border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:3px}
.alt{border-left:3px solid var(--line);padding-left:10px;margin:8px 0;list-style:none}
.addbox{margin-top:28px;padding:18px;border:1px dashed var(--line);border-radius:14px;background:var(--paper)}
.addbox h3{font-size:18px;margin-bottom:10px}
.f3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
.more{display:block;margin:18px auto 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.tile{border:0;padding:0;background:var(--paper);border-radius:10px;overflow:hidden;text-align:left;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.tile img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--soft)}
.tile span{display:block;padding:6px 8px;font-size:13px;font-weight:700}
.tile em{display:block;font-style:normal;font-weight:400;color:var(--mute);font-size:12px}
.pref{display:grid;grid-template-columns:5.5em minmax(0,1fr) 5.5em;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;min-height:44px;text-align:left}
.pref .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.pref .bar i{display:block;height:100%;background:var(--shu)}
.pref .n{text-align:right;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;line-height:1.2;padding:4px 0}
.pref .n small{font-size:12px;font-weight:400;color:var(--mute)}
.pref.full .n{color:var(--shu);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(10,8,6,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(4vw,16px) 28px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.prog i{transition:none}}
.sh-h{display:flex;justify-content:space-between;gap:10px;align-items:start}
.sh-h h2{font-size:clamp(26px,6vw,34px)}
.x{width:44px;height:44px;border:0;background:var(--paper);border-radius:50%;font-size:22px;flex:none}
.big-chk{display:flex;align-items:center;gap:12px;width:100%;margin:16px 0;min-height:56px;padding:0 16px;border-radius:12px;border:2px solid var(--shu);background:var(--paper);color:var(--shu);font-weight:700;font-size:17px}
.big-chk.on{background:var(--shu);color:#fff}
.big-chk b{width:26px;height:26px;border:2px solid currentColor;border-radius:6px;display:grid;place-items:center}
.lbl{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.sgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.sgal figure{margin:0;position:relative}
.sgal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:var(--soft);cursor:zoom-in}
.sgal .rm{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.up{display:grid;place-items:center;aspect-ratio:3/4;border:2px dashed var(--shu);border-radius:8px;color:var(--shu);font-weight:700;font-size:14px;text-align:center;cursor:pointer;padding:6px}
.up input{position:absolute;width:1px;height:1px;opacity:0}
#lb{align-items:center;flex-direction:column;gap:10px;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:82vh;border-radius:6px}
#lb p{color:#fff;margin:0}
.cf{background:var(--bg);border-radius:14px;padding:20px;width:min(360px,92%);margin:auto}
.cf p{margin:0 0 16px}
.cf div{display:flex;gap:8px;justify-content:flex-end}
#cfo{align-items:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
@media(max-width:600px){.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.f3{grid-template-columns:1fr 1fr}.f3 input:first-child{grid-column:1/-1}.f3 button{grid-column:1/-1}.band .in{grid-template-columns:1fr}.big,.sub{text-align:left}.pref{grid-template-columns:4.8em minmax(0,1fr) 4.6em}}

const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("sanpai",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error)})},
  req(mode,fn){return new Promise((res,rej)=>{const q=fn(this.db.transaction("img",mode).objectStore("img"));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  put(k,b){return this.req("readwrite",s=>s.put(b,k))},get(k){return this.req("readonly",s=>s.get(k))},del(k){return this.req("readwrite",s=>s.delete(k))},
  each(cb){return new Promise((res,rej)=>{const q=this.db.transaction("img").objectStore("img").openCursor();q.onsuccess=()=>{const c=q.result;if(c){cb(c.key,c.value);c.continue()}else res()};q.onerror=()=>rej(q.error)})}};

const newKey=()=>"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function storeBlob(blob){
  if(assets){const a=await assets.upload(blob);return{a:a.id,u:a.url}}
  if(mode!=="db"&&IDB.db){const k=newKey();await IDB.put(k,blob);URLS[k]=URL.createObjectURL(blob);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}return{k}}
  return{d:await toDataURL(blob)}
}
function toDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
function fromDataURL(d){const[m,b64]=d.split(",");const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(m.match(/data:([^;]+)/)||[])[1]||"image/jpeg"})}

function pc(d,t){if(!t||!d)return"0%";const p=d/t*100;return(p>=100?100:p<10?p.toFixed(1):p.toFixed(1).replace(/\.0$/,""))+"%"}

async function canvasOf(file,max){
  let img;try{img=await createImageBitmap(file)}catch(e){img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=img.width||img.naturalWidth,h=img.height||img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c;
}
async function addImages(id,files){
  const add=[];toast("御朱印をアップロード中…");
  for(const f of files){try{
    const small=mode==="db"&&!assets,c=await canvasOf(f,small?800:1600);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",small?.72:.86));
    add.push({...await storeBlob(blob),t:Date.now()+add.length})
  }catch(e){toast("読み込めない画像がありました")}}
  if(!add.length)return;
  const r=rec[id]||{},img=(r.img||[]).concat(add);
  if(mode==="db"&&!assets&&JSON.stringify(img).length>240000){toast("この環境では1社あたりの画像容量に上限があります");return}
  setRec(id,{img,v:true,d:r.d||today()});toast("御朱印を追加しました");
}

function setView(v){view=v;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===v));["list","meguri","book","pref"].forEach(k=>$("#v-"+k).hidden=k!==v);render();window.scrollTo(0,0)}
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(t)setView(t.dataset.v)});
document.body.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t){toggle(t.dataset.t);return}
  const o=e.target.closest("[data-o]");if(o){openSheet(o.dataset.o);return}
  const l=e.target.closest("[data-lb]");if(l){lightbox(l.dataset.lb);return}
  const gg=e.target.closest("[data-g]");if(gg){openG=openG===gg.dataset.g?null:gg.dataset.g;render();return}
  const p=e.target.closest("[data-p]");if(p){F.pref=p.dataset.p;F.reg=REG[F.pref];$("#fr").value=F.reg;prefOpts();setView("list");return}
  if(e.target.id==="more"){limit+=300;render()}
});
$("#ov").addEventListener("click",async e=>{
  if(e.target.id==="ov"||e.target.id==="xs"){closeSheet();return}
  if(e.target.closest("#bc")){toggle(openId);return}
  const rm=e.target.closest("[data-rm]");
  if(rm){const id=openId,i=+rm.dataset.rm;if(!await confirmBox("この御朱印の画像を削除しますか？"))return;
    const r=rec[id]||{},img=(r.img||[]).slice(),[x]=img.splice(i,1);if(x&&x.a&&assets)assets.delete(x.a).catch(()=>{});if(x&&x.k&&IDB.db){IDB.del(x.k).catch(()=>{});URL.revokeObjectURL(URLS[x.k]);delete URLS[x.k]}setRec(id,{img});return}
  if(e.target.id==="delc"){const id=openId;if(!await confirmBox("この神社と記録を削除しますか？"))return;
    delete custom[id];cache=null;put("c-"+id,null);if(rec[id]){delete rec[id];put("r-"+id,null)}closeSheet();render()}
});
$("#ov").addEventListener("change",e=>{
  if(e.target.id==="fi"&&e.target.files.length)addImages(openId,[...e.target.files]);
  if(e.target.id==="sd")setRec(openId,{d:e.target.value});
});
$("#ov").addEventListener("input",e=>{if(e.target.id==="sm"){const id=openId,v=e.target.value;clearTimeout(mt);mt=setTimeout(()=>setRec(id,{m:v}),700)}});
$("#lb").addEventListener("click",()=>$("#lb").classList.remove("on"));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#lb").classList.contains("on"))$("#lb").classList.remove("on");else if(openId)closeSheet()}});
$("#addf").addEventListener("submit",e=>{e.preventDefault();const n=$("#an").value.trim();if(!n)return;
  const id="u"+Date.now().toString(36),c={name:n,pref:$("#ap").value,city:$("#ac").value.trim()};
  custom[id]=c;cache=null;put("c-"+id,c);$("#an").value="";$("#ac").value="";render();toast(c.name+" を追加しました");openSheet(id)});

/* ---------- backup ---------- */
async function exportData(){
  toast("バックアップを作成中…");
  const images={},outRec={};let miss=0;
  for(const[id,r]of Object.entries(rec)){const img=[];
    for(const x of(r.img||[])){try{
      const key="k"+(x.t||0)+"_"+img.length+"_"+id;let d=null;
      if(x.d)d=x.d;else if(x.k){const b=await IDB.get(x.k);if(b)d=await toDataURL(b)}else{const b=await(await fetch(src(x))).blob();d=await toDataURL(b)}
      if(d){images[key]=d;img.push({k:key,t:x.t||0})}else miss++}catch(e){miss++}}
    outRec[id]={...r,img}}
  const json=JSON.stringify({app:"sanpai",v:1,at:new Date().toISOString(),rec:outRec,custom,images});
  const name="神社参拝帳_バックアップ_"+today()+".json";
  const C=window.claude;let dl=null;if(C&&C.use){try{dl=await C.use("downloads")}catch(e){}}
  if(dl){try{await dl.save({filename:name,data:new Blob([json])});done()}catch(e){if(e&&e.code!=="declined")toast("書き出せませんでした")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);done();
  function done(){try{localStorage.setItem(LS+"-bk",today())}catch(e){}bkInfo();toast(miss?`書き出しました（画像${miss}枚は読み込めず除外）`:"バックアップを書き出しました")}
}
async function importData(file){
  let o;try{o=JSON.parse(await file.text())}catch(e){toast("バックアップファイルを読み込めませんでした");return}
  if(!o||o.app!=="sanpai"){toast("神社参拝帳のバックアップではありません");return}
  const n=Object.keys(o.rec||{}).length;
  if(!await confirmBox(`バックアップ（${n}社分の記録、画像${Object.keys(o.images||{}).length}枚）を読み込みます。同じ神社の記録は、バックアップの内容で更新されます。`,"読み込む"))return;
  toast("読み込み中…");
  for(const[k,c]of Object.entries(o.custom||{})){custom[k]=c;put("c-"+k,c)}cache=null;
  for(const[id,r]of Object.entries(o.rec||{})){
    const cur=rec[id]||{},have=new Set((cur.img||[]).map(x=>x.t)),img=(cur.img||[]).slice();
    for(const x of(r.img||[])){if(have.has(x.t))continue;const d=o.images&&o.images[x.k];if(!d)continue;
      try{img.push({...await storeBlob(fromDataURL(d)),t:x.t})}catch(e){}}
    const nr={...cur,...r,img};if(!nr.img.length)delete nr.img;rec[id]=nr;put("r-"+id,nr)}
  render();toast(`${n}社分の記録を読み込みました`);
}
function bkInfo(){let d="";try{d=localStorage.getItem(LS+"-bk")||""}catch(e){}$("#bkinfo").textContent=d?"最後に書き出した日："+d.replaceAll("-","/"):"まだ書き出していません。"}
$("#exp").addEventListener("click",exportData);
$("#imp").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)importData(f)});
bkInfo();

/* ---------- start ---------- */
loadLocal();render();
status("読み込み中…");
(async()=>{
  try{await IDB.open();await IDB.each((k,b)=>{URLS[k]=URL.createObjectURL(b)});render()}catch(e){}
  const C=window.claude;
  if(!C||!C.use){status("記録はこのスマホの中に保存されます。ときどきバックアップを書き出してください");return}
  try{
    const[db,user]=await Promise.all([C.use("db"),C.use("user")]);
    const uid=db&&user?await user.id():null;
    assets=await C.use("assets");
    if(!db||!uid){status("この端末のブラウザに記録を保存しています（サインインすると全端末で同期）");return}
    col=db.collection("data/users/"+uid);
    const tm=setTimeout(()=>status("記録を読み込めていません。通信状況を確認してください"),10000);
    col.onSnapshot(s=>{
      if(!s.metadata.fromCache){clearTimeout(tm);status("記録はあなた専用に保存され、どの端末からでも見られます")}
      const r={},c={};s.docs.forEach(d=>{const v=d.data();if(d.id.startsWith("r-"))r[d.id.slice(2)]=v;else if(d.id.startsWith("c-"))c[d.id.slice(2)]=v});
      if(mode!=="db"){mode="db";
        if(s.empty&&!s.metadata.fromCache&&(Object.keys(rec).length||Object.keys(custom).length)){
          Object.entries(custom).forEach(([k,v])=>{c[k]=v;put("c-"+k,v)});Object.entries(rec).forEach(([k,v])=>{r[k]=v;put("r-"+k,v)})}}
      rec=r;custom=c;render();if(openId)sheetDyn();
    },()=>{clearTimeout(tm);status("同期が止まりました。ページを開き直してください")});
  }catch(e){status("この端末のブラウザに記録を保存しています")}
})();
}
